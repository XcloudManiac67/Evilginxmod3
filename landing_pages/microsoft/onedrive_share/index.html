<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{param:folder_name} - OneDrive</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="onedrive-container">
        <header class="od-header">
            <div class="od-logo">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="#0078D4" d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
                </svg>
                <span class="od-brand">OneDrive</span>
            </div>
            <div class="od-search">
                <input type="text" placeholder="Search OneDrive">
            </div>
            <div class="od-user">
                <div class="user-avatar"></div>
            </div>
        </header>

        <div class="od-main">
            <aside class="od-sidebar">
                <nav class="od-nav">
                    <a href="#" class="nav-item active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        My files
                    </a>
                    <a href="#" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Shared
                    </a>
                    <a href="#" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        Recent
                    </a>
                    <a href="#" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="6 3 20 12 6 21 6 3"></polygon>
                        </svg>
                        Photos
                    </a>
                    <a href="#" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                        </svg>
                        Activity
                    </a>
                </nav>
            </aside>

            <main class="od-content">
                <div class="folder-header">
                    <div class="breadcrumb">
                        <span>Files</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span class="current">{param:folder_name}</span>
                    </div>
                    <h1>{param:folder_name}</h1>
                    <p class="folder-info">{param:item_count} • Shared by {param:sender_name} • {param:share_date}</p>
                </div>

                <div class="toolbar">
                    <button class="btn-open" onclick="openFolder()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Open
                    </button>
                    <button class="btn-download" onclick="downloadFolder()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download
                    </button>
                </div>

                <div class="file-grid">
                    <div class="file-item">
                        <div class="file-icon folder">
                            <svg viewBox="0 0 24 24" width="48" height="48">
                                <path fill="#FFB900" d="M10 4H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
                            </svg>
                        </div>
                        <div class="file-name">Documents</div>
                        <div class="file-meta">Folder</div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon excel">
                            <svg viewBox="0 0 24 24" width="48" height="48">
                                <path fill="#217346" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                                <text x="12" y="18" font-size="6" fill="#fff" text-anchor="middle">XLS</text>
                            </svg>
                        </div>
                        <div class="file-name">Budget.xlsx</div>
                        <div class="file-meta">2.4 MB</div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon powerpoint">
                            <svg viewBox="0 0 24 24" width="48" height="48">
                                <path fill="#D24726" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                                <text x="12" y="18" font-size="5" fill="#fff" text-anchor="middle">PPT</text>
                            </svg>
                        </div>
                        <div class="file-name">Presentation.pptx</div>
                        <div class="file-meta">5.1 MB</div>
                    </div>
                    <div class="file-item">
                        <div class="file-icon pdf">
                            <svg viewBox="0 0 24 24" width="48" height="48">
                                <path fill="#F40F02" d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6z"/>
                                <text x="12" y="18" font-size="5" fill="#fff" text-anchor="middle">PDF</text>
                            </svg>
                        </div>
                        <div class="file-name">Report.pdf</div>
                        <div class="file-meta">1.2 MB</div>
                    </div>
                </div>
            </main>
        </div>

        <footer class="od-footer">
            <p>© Microsoft 2024 • <a href="#">Privacy</a> • <a href="#">Terms</a></p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
