<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{param:meeting_title} - Microsoft Teams Meeting</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="teams-container">
        <header class="teams-header">
            <div class="teams-brand">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path fill="#5B5FC7" d="M20.625 10.5h-3.75c-1.036 0-1.875-.84-1.875-1.875V5.25a1.875 1.875 0 0 1 3.75 0v5.25z"/>
                    <path fill="#5B5FC7" d="M16.875 6.75c0 1.657-1.343 3-3 3s-3-1.343-3-3 1.343-3 3-3 3 1.343 3 3z"/>
                    <path fill="#7B83EB" d="M4.5 3h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9A2.25 2.25 0 0 1 2.25 14.25v-9A2.25 2.25 0 0 1 4.5 3z"/>
                    <circle cx="9" cy="12" r="2" fill="#fff"/>
                    <path d="M6 8.25a.75.75 0 0 1 .75-.75h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1-.75-.75z" fill="#fff"/>
                </svg>
                <span>Microsoft Teams</span>
            </div>
        </header>

        <main class="meeting-card">
            <div class="meeting-header">
                <div class="meeting-icon">
                    <svg viewBox="0 0 24 24" width="40" height="40">
                        <path fill="#5B5FC7" d="M20.625 10.5h-3.75c-1.036 0-1.875-.84-1.875-1.875V5.25a1.875 1.875 0 0 1 3.75 0v5.25z"/>
                        <path fill="#5B5FC7" d="M16.875 6.75c0 1.657-1.343 3-3 3s-3-1.343-3-3 1.343-3 3-3 3 1.343 3 3z"/>
                    </svg>
                </div>
                <div class="meeting-title-wrap">
                    <h1>{param:meeting_title}</h1>
                    <p class="meeting-type">Microsoft Teams Meeting</p>
                </div>
            </div>

            <div class="meeting-details">
                <div class="detail-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <div>
                        <div class="detail-label">{param:meeting_date}</div>
                        <div class="detail-value">{param:meeting_time}</div>
                    </div>
                </div>

                <div class="detail-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <div>
                        <div class="detail-label">Organizer</div>
                        <div class="detail-value">{param:organizer_name} ({param:organizer_email})</div>
                    </div>
                </div>

                <div class="detail-row">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <div>
                        <div class="detail-label">Meeting ID</div>
                        <div class="detail-value">{timestamp}</div>
                    </div>
                </div>
            </div>

            <div class="join-section">
                <button class="btn-join" onclick="joinMeeting()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0zM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
                    </svg>
                    Join Meeting
                </button>
                <p class="join-hint">Click to join the meeting from your browser</p>
            </div>

            <div class="calendar-section">
                <button class="btn-calendar" onclick="addToCalendar()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Add to calendar
                </button>
            </div>
        </main>

        <footer class="teams-footer">
            <p>Microsoft Teams • Secure meeting connection</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
