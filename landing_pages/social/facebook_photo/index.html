<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="fb-container">
        <header class="fb-header">
            <div class="fb-logo">
                <svg viewBox="0 0 36 36" width="40" height="40">
                    <path fill="#1877F2" d="M20.181 35.87C29.094 34.791 36 26.69 36 18c0-9.941-8.059-18-18-18S0 8.059 0 18c0 8.442 5.811 15.526 13.652 17.471L14 34h5.5l.681 1.87Z"/>
                    <path fill="#fff" d="M13.651 35.471v-11.97H9.936V18h3.715v-2.37c0-6.127 2.772-8.964 8.784-8.964 1.138 0 3.103.223 3.91.446v4.983c-.815-.223-2.355-.446-3.91-.446-2.621 0-3.615 1.012-3.615 3.622V18h6.635l-1.033 5.501h-5.603v12.37a18.183 18.183 0 0 1-6.88-1.389Z"/>
                </svg>
            </div>
        </header>

        <main class="fb-feed">
            <div class="fb-post">
                <div class="post-header">
                    <div class="user-avatar">{param:poster_name}</div>
                    <div class="post-info">
                        <div class="user-name">{param:poster_name}</div>
                        <div class="post-meta">2 hrs · <svg class="privacy-icon" viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
                    </div>
                </div>

                <div class="post-text">
                    <p>{param:post_text}</p>
                </div>

                <div class="photo-grid">
                    <div class="photo-main">
                        <div class="photo-placeholder landscape">
                            <div class="photo-icon">🏔️</div>
                        </div>
                    </div>
                    <div class="photo-thumbs">
                        <div class="thumb-item">
                            <div class="photo-placeholder square">🌅</div>
                        </div>
                        <div class="thumb-item">
                            <div class="photo-placeholder portrait">🎉</div>
                        </div>
                        <div class="thumb-item overlay">
                            <div class="photo-placeholder landscape">+21</div>
                        </div>
                    </div>
                </div>

                <div class="album-info">
                    <div class="album-details">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
                            <path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/>
                        </svg>
                        <div>
                            <div class="album-name">{param:album_name}</div>
                            <div class="album-count">{param:photo_count}</div>
                        </div>
                    </div>
                    <button class="btn-view-album" onclick="viewAlbum()">View Album</button>
                </div>

                <div class="post-stats">
                    <span class="reactions">❤️👍😮 156</span>
                    <span class="engagement">24 comments · 8 shares</span>
                </div>

                <div class="post-actions">
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        Like
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg>
                        Comment
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
                        Share
                    </button>
                </div>

                <div class="privacy-notice">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#65676b">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                    <p>Sign in to see more photos and interact with this post</p>
                    <button class="btn-signin-fb" onclick="signIn()">Sign In</button>
                </div>
            </div>
        </main>

        <footer class="fb-footer">
            <p>Facebook © 2024</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
