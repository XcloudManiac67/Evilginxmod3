<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{param:account_name} on X</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="twitter-container">
        <header class="twitter-header">
            <div class="twitter-logo">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </div>
        </header>

        <main class="tweet-container">
            <div class="tweet-card">
                <div class="tweet-header">
                    <div class="profile-image">{param:account_name}</div>
                    <div class="profile-info">
                        <div class="display-name">{param:account_name}</div>
                        <div class="username">{param:account_handle}</div>
                    </div>
                    <div class="verified-badge">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="#1d9bf0">
                            <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.9-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.4.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.2l1.4-1.4 2.35 2.35 5.5-5.54 1.4 1.42-6.91 6.99z"/>
                        </svg>
                    </div>
                </div>

                <div class="tweet-content">
                    <p>{param:preview_text}</p>
                </div>

                <div class="restricted-notice">
                    <div class="lock-icon">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                            <path d="M17.5 7H17V6c0-2.76-2.24-5-5-5S7 3.24 7 6v1h-.5C5.67 7 5 7.67 5 8.5v11c0 .83.67 1.5 1.5 1.5h11c.83 0 1.5-.67 1.5-1.5v-11c0-.83-.67-1.5-1.5-1.5zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3-10H9V6c0-1.66 1.34-3 3-3s3 1.34 3 3v1z"/>
                        </svg>
                    </div>
                    <h3>Sign in to view this content</h3>
                    <p>This {param:content_type} is only available to authenticated users. Sign in to continue reading this thread.</p>
                    <button class="btn-x-signin" onclick="signInToX()">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                        Sign in to X
                    </button>
                </div>

                <div class="tweet-stats">
                    <div class="stat">
                        <span class="stat-value">2.4K</span>
                        <span class="stat-label">Retweets</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value">847</span>
                        <span class="stat-label">Quotes</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value">12.1K</span>
                        <span class="stat-label">Likes</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value">234K</span>
                        <span class="stat-label">Views</span>
                    </div>
                </div>

                <div class="tweet-actions">
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01z"/>
                        </svg>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M4.5 3.88l4.432 4.14-1.364 1.46L5.5 7.55V16c0 4.1 3.9 7.5 8 7.5s8-3.4 8-7.5V7.55l-2.068 1.91-1.365-1.46L21.5 3.88v8.97c0 5.05-4.18 9.15-9 9.15s-9-4.1-9-9.15V3.88z"/>
                        </svg>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.28-8.487 8.07-4.485-2.79-7.135-5.59-8.486-8.08-1.485-2.73-.799-5.02.484-6.6 1.296-1.6 3.49-2.33 5.586-2.2 1.43.08 2.835.7 4.026 1.87l.473.47.478-.48c1.19-1.16 2.59-1.78 4.017-1.86 2.098-.13 4.29.6 5.585 2.2 1.283 1.58 1.97 3.87.484 6.6z"/>
                        </svg>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M8.75 21V3h2v18h-2zM18 21V8.5h2V21h-2zM4 21l.004-10h2L6 21H4zm9.248 0v-7h2v7h-2z"/>
                        </svg>
                    </button>
                    <button class="action-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>

        <footer class="twitter-footer">
            <p>© 2024 X Corp.</p>
        </footer>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
